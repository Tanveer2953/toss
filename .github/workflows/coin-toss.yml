name: 24/7 Cloud Background Coin Toss Runner

on:
  schedule:
    # Runs automatically in the cloud every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  toss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute Cloud Background Coin Flips
        run: python toss_cloud_runner.py

      - name: Commit & Push Updated Toss Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 24/7 cloud coin toss data" && git push)
